name: Auto-merge

# Pull requests merge on their own once the required "check" passes:
# - the owner's, unless opened as a draft; marking a draft ready merges it.
#   Merge commit as before: the title (release: for a version title) and
#   the first paragraph of the description.
# - Dependabot's patch and minor updates, squashed; major ones, and any
#   whose type can't be read, wait for a review by hand.
# Contributors' pull requests are left for review.
# pull_request_target gives the token write access; no job checks out or
# runs code from the pull request.
on:
    pull_request_target:
        types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
    owner:
        if: github.repository == 'venvk/obsidian-library-plugin' && github.event.pull_request.user.login == 'venvk' && !github.event.pull_request.draft
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            pull-requests: write

        steps:
            - name: Enable auto-merge
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: |
                  subject="$PR_TITLE (#$PR_NUMBER)"
                  if [[ "$PR_TITLE" =~ ^[0-9]+\.[0-9]+\.[0-9]+[[:space:]] ]]; then
                      subject="release: $subject"
                  fi
                  # First paragraph of the description, without template comments.
                  body="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '/^<!--.*-->$/ { next } NF { p = 1 } p && !NF { exit } p')"
                  gh pr merge --auto --merge --subject "$subject" --body "$body" "$PR_URL"

            # A draft's check passed before it was ready, so "Delete merged
            # branches" already ran and found nothing to delete: start it again.
            - name: Delete the branch once merged
              if: github.event.action == 'ready_for_review'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: gh workflow run delete-merged-branches.yml --repo "$REPO" -f branch="$HEAD_REF"

    dependabot:
        if: github.repository == 'venvk/obsidian-library-plugin' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            # Only actions by GitHub may run here, so the update type is read
            # from Dependabot's commit message rather than with fetch-metadata:
            # "update-type: version-update:semver-…" on version updates, and
            # "from X to Y" on every update, security ones included.
            - name: Enable auto-merge for patch and minor updates
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  COMMITS: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits
              run: |
                  messages="$(gh api "$COMMITS" --jq '.[].commit.message')"
                  types="$(grep -o 'update-type: version-update:semver-[a-z]*' <<<"$messages" || true)"
                  bumps="$(grep -oE 'from v?[0-9]+(\.[0-9]+)* to v?[0-9]+(\.[0-9]+)*' <<<"$messages" | tr -d v || true)"
                  echo "${types:-no update-type}"
                  echo "${bumps:-no versions}"
                  if [ -z "$types$bumps" ]; then
                      echo "Update type unknown: left for review."
                      exit 0
                  fi
                  # Major: a new first number, or a new second one below 1.0.
                  major="$(awk '{ split($2, a, "."); split($4, b, "."); if (a[1] != b[1] || (a[1] == 0 && a[2] != b[2])) print }' <<<"$bumps")"
                  if grep -q semver-major <<<"$types" || [ -n "$major" ]; then
                      echo "Major update: left for review."
                      exit 0
                  fi
                  gh pr merge --auto --squash "$PR_URL"
